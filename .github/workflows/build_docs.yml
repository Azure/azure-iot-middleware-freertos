name: Build and Deploy Docs

on:
  workflow_dispatch:
    inputs:
        commitRef:
          description: 'Git SHA commit to use to build docs'
          required: true

jobs:
  push-docs:

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.commitRef }}

      - name: Install and Build Doxygen
        run: .github/scripts/doxygen.sh

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: doc/html
          clean: true
          ssh-key: ${{ secrets.DEPLOY_KEY }}
